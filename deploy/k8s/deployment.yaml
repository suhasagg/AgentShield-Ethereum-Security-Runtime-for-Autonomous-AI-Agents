apiVersion: v1
kind: Namespace
metadata: {name: agentshield}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agentshield-api, namespace: agentshield}
spec:
  replicas: 3
  selector: {matchLabels: {app: agentshield-api}}
  template:
    metadata: {labels: {app: agentshield-api}}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
      - name: api
        image: your-registry/agentshield:0.1.0
        ports: [{containerPort: 8000}]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 3}
        livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10}
