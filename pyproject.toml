[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.0"
description = "Zero-trust Ethereum security runtime for autonomous AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "web3>=7,<8",
  "eth-account>=0.13,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "redis>=5,<6",
  "PyJWT>=2.9,<3",
  "cryptography>=43,<45",
  "structlog>=24,<26",
  "prometheus-client>=0.20,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[project.scripts]
agentshield = "agentshield.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
