services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentshield
      POSTGRES_PASSWORD: agentshield
      POSTGRES_DB: agentshield
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentshield"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  api:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8000:8000"]
